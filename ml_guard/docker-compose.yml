version: '3.8'

services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ml_guard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ml_guard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-ml_guard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ml_guard_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ml_guard_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml_guard_backend
    restart: always
    env_file:
      - .env.production.template   # Override with real .env in CI/CD
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ml_guard_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ml_guard}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-REPLACE_WITH_SECURE_RANDOM_32_BYTE_HEX}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml_guard_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ml_guard_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ml_guard}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-REPLACE_WITH_SECURE_RANDOM_32_BYTE_HEX}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MinIO Object Storage ────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ml_guard_minio
    restart: always
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9005:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ml_guard_frontend
    restart: always
    ports:
      - "5174:80"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
      - minio

volumes:
  postgres_data:
  minio_data:
