name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pandas numpy scipy scikit-learn
          # Assuming you run tests from sdk directory
          cd sdk
          pip install -e .[all]
          
      - name: Run tests
        run: |
          cd sdk
          pytest tests/
          
      - name: Build package
        run: |
          cd sdk
          python -m build
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: sdk/dist/
