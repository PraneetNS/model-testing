name: ML Guard — Governance Gate

on:
  push:
    branches: [master, main]
    paths:
      - 'ml_guard/backend/**'
      - '.github/scripts/**'
      - '**.pkl'
      - '**.csv'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model name to audit'
        required: false
        default: 'TestChurnModel-v1'
      strict_mode:
        description: 'Fail on WARNING (strict)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  ML_GUARD_URL: ${{ secrets.ML_GUARD_API_URL }}
  ML_GUARD_KEY: ${{ secrets.ML_GUARD_API_KEY }}

jobs:
  # ── Job 1: Backend Health & Import Check ──────────
  backend-check:
    name: Backend Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_guard/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            ml_guard/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy \
            pydantic pydantic-settings python-dotenv \
            structlog passlib python-jose httpx \
            requests pytest

      - name: Check Python imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from app.core.config import settings
              print('✓ config imports OK')
              from app.db.models import (
                  Model, ScanRecord, ReportCard,
                  ModelContract, ContractBreach,
                  PredictionLog, DriftReport,
                  PerformanceSnapshot
              )
              print('✓ all DB models import OK')
              from app.services.governance_engine import (
                  GovernanceEngine
              )
              print('✓ governance engine imports OK')
              from app.services.contract_engine import (
                  ContractEngine
              )
              print('✓ contract engine imports OK')
              from app.services.certificate_engine import (
                  CertificateEngine
              )
              print('✓ certificate engine imports OK')
          except ImportError as e:
              print(f'✗ Import failed: {e}')
              sys.exit(1)
          "

      - name: Verify router files exist
        run: |
          python -c "
          import os
          required_routers = [
              'audit', 'governance', 'contracts',
              'ingest', 'auth', 'gate', 'forecast',
              'sentinel', 'reports', 'policies',
              'model_registry', 'drift', 'performance',
              'fairness', 'llm_eval', 'history',
          ]
          missing = []
          for r in required_routers:
              path = f'app/routers/{r}.py'
              if not os.path.exists(path):
                  missing.append(r)
          if missing:
              print(f'✗ Missing routers: {missing}')
              exit(1)
          print(f'✓ All {len(required_routers)} routers present')
          "

  # ── Job 2: Unit Tests ──────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: ml_guard/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            ml_guard/backend/requirements.txt

      - name: Install test deps
        run: |
          pip install pytest pytest-asyncio \
            httpx fastapi sqlalchemy \
            pydantic pydantic-settings \
            python-dotenv structlog \
            passlib python-jose requests

      - name: Run governance engine unit tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DATABASE_URL',
              'sqlite:///./test.db')
          os.environ.setdefault('SECRET_KEY',
              'test-secret-for-ci')

          from app.services.governance_engine import (
              GovernanceEngine
          )
          from app.services.contract_engine import (
              ContractEngine
          )
          from app.services.certificate_engine import (
              CertificateEngine
          )

          # Test governance engine scoring logic
          engine = GovernanceEngine()
          verdict = engine.get_verdict(85.0)
          assert verdict == 'CERTIFIED', \
              f'Expected CERTIFIED got {verdict}'
          verdict = engine.get_verdict(65.0)
          assert verdict == 'CONDITIONAL', \
              f'Expected CONDITIONAL got {verdict}'
          verdict = engine.get_verdict(45.0)
          assert verdict == 'FAILED', \
              f'Expected FAILED got {verdict}'
          print('✓ Governance verdict logic correct')

          # Test live decay formula
          live, dp, pp = engine._compute_live_decay(
              80.0, None, None)
          assert live == 80.0, \
              'No drift should give same score'
          print('✓ Live decay formula correct')

          # Test certificate hash generation
          from datetime import datetime
          cert_engine = CertificateEngine()
          h1 = cert_engine.generate_cert_hash(
              'model-1', 80.0, datetime(2026,1,1))
          h2 = cert_engine.generate_cert_hash(
              'model-1', 80.0, datetime(2026,1,1))
          assert h1 == h2, 'Same input = same hash'
          h3 = cert_engine.generate_cert_hash(
              'model-2', 80.0, datetime(2026,1,1))
          assert h1 != h3, 'Different model = different hash'
          print('✓ Certificate hash deterministic')

          # Test contract engine operators
          ce = ContractEngine()
          assert ce._evaluate(0.3, 'lte', 0.5) == True
          assert ce._evaluate(0.7, 'lte', 0.5) == False
          assert ce._evaluate(0.8, 'gte', 0.7) == True
          assert ce._evaluate(0.3, 'gte', 0.7) == False
          print('✓ Contract operator logic correct')

          print()
          print('All unit tests passed ✓')
          "

  # ── Job 3: Governance Gate (Live API) ─────────────
  governance-gate:
    name: ML Guard Governance Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    # Runs independently — does not block frontend-check
    if: |
      vars.ML_GUARD_API_URL != '' &&
      secrets.ML_GUARD_API_KEY != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install requests
        run: pip install requests

      - name: Health check ML Guard API
        run: |
          python -c "
          import requests, sys
          url = '${{ env.ML_GUARD_URL }}'
          if not url or url == '':
              print('⚠ ML_GUARD_API_URL not set, skipping')
              sys.exit(0)
          r = requests.get(f'{url}/health', timeout=10)
          if r.status_code != 200:
              print(f'✗ API unhealthy: {r.status_code}')
              sys.exit(1)
          v = r.json().get('version','unknown')
          print(f'✓ ML Guard API healthy (v{v})')
          "

      - name: Run governance gate check
        env:
          STRICT_MODE: ${{ inputs.strict_mode || 'false' }}
          MODEL_NAME: ${{ inputs.model_name || 'TestChurnModel-v1' }}
        run: |
          python .github/scripts/ml_guard_ci.py \
            --api-url "${{ env.ML_GUARD_URL }}" \
            --api-key "${{ env.ML_GUARD_KEY }}" \
            --model-name "$MODEL_NAME" \
            --model-path "test_model.pkl" \
            --data-path "test_val.csv" \
            --label-col "target" \
            --min-score 60 \
            --strict "$STRICT_MODE"

      - name: Post governance summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## ML Guard Governance Report\n\n';
            try {
              const data = JSON.parse(
                fs.readFileSync('governance_result.json', 'utf8')
              );
              const emoji =
                data.verdict === 'CERTIFIED' ? '✅' :
                data.verdict === 'CONDITIONAL' ? '⚠️' : '❌';
              summary += `${emoji} **Verdict: ${data.verdict}**\n\n`;
              summary += `| Metric | Value |\n|--------|-------|\n`;
              summary += `| Overall Score | ${data.overall_score}/100 |\n`;
              summary += `| Live Score | ${data.live_score}/100 |\n`;
              summary += `| Gate Status | ${data.gate_passed ? 'PASSED ✅' : 'FAILED ❌'} |\n`;
              if (data.contract_breaches > 0) {
                summary += `| Contract Breaches (24h) | ${data.contract_breaches} ⚠️ |\n`;
              }
              if (data.recommendations?.length > 0) {
                summary += '\n### Recommendations\n';
                data.recommendations.forEach(r => {
                  summary += `- ${r}\n`;
                });
              }
            } catch(e) {
              summary += '⚠️ Could not read governance result.\n';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # ── Job 4: Frontend Build Check ───────────────────
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    # Intentionally has NO 'needs' — runs independently
    # so a gate failure never blocks a frontend build check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ml_guard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ml_guard/frontend
        run: npm ci

      - name: Type check
        working-directory: ml_guard/frontend
        run: npx tsc --noEmit || true
        # || true so TS errors are warnings, not hard failures

      - name: Build check
        working-directory: ml_guard/frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
          NEXT_PUBLIC_API_KEY: ci-placeholder-key
        run: npm run build
