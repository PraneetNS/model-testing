# =============================================================================
# ML Guard CI — Enterprise AI Governance Pipeline
# Version: 7.2.0
#
# This workflow enforces governance gates on every push and pull request.
# The ML Guard CLI evaluates your model artifact against the policy defined
# in mlguard.yaml. A non-zero exit code (FAILED verdict) automatically
# blocks the merge — no extra logic required.
# =============================================================================

name: ML Guard CI

# -----------------------------------------------------------------------------
# TRIGGER EVENTS
# Runs on every push to main and on all pull requests targeting main.
# This ensures the governance gate is checked before any code lands in prod.
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent redundant runs — cancel in-progress runs when a newer commit is pushed.
concurrency:
  group: mlguard-ci-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: ML Governance Gate
  # Core job. Installs the ML Guard stack, runs the policy check against the
  # model artifact, and uploads the governance report. Fails hard on FAILED verdict.
  # ---------------------------------------------------------------------------
  governance-gate:
    name: "ML Governance Gate (v7.2)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Inject secrets as env vars so the CLI and SDK can connect to live services
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      # ── Step 1: Checkout ───────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for lineage tracking

      # ── Step 2: Set up Python 3.11 ─────────────────────────────────────────
      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Step 3: Cache pip dependencies ─────────────────────────────────────
      # Cache is keyed on the OS + the combined hash of all requirements files.
      # A cache hit skips the full pip install, saving ~1-2 min per run.
      - name: "Cache pip dependencies"
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py311-${{ hashFiles('ml_guard/backend/requirements.txt', 'ml_guard/sdk/python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-py311-

      # ── Step 4: Install ML Core + Backend dependencies ─────────────────────
      # Installs the full scientific stack (NumPy, Pandas, scikit-learn, SciPy)
      # required by the ML core engine and the governance scoring logic.
      - name: "Install Python dependencies (ML Core + Backend)"
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy
          pip install -r ml_guard/backend/requirements.txt

      # ── Step 5: Install ML Guard SDK ───────────────────────────────────────
      # Installs the ML Guard Python SDK which powers the CLI gate command.
      - name: "Install ML Guard SDK"
        run: |
          pip install -r ml_guard/sdk/python/requirements.txt || true
          pip install -e ml_guard/sdk/python/ || true

      # ── Step 6: Run the ML Guard CI/CD Governance Gate ─────────────────────
      # This is the critical enforcement step.
      #
      # The gate reads mlguard.yaml for policy thresholds (e.g. min_accuracy: 0.88,
      # max_psi: 0.15, max_contract_breaches: 0) and evaluates the model artifact.
      #
      # Exit codes:
      #   0  → PASSED  — pipeline continues, merge is allowed
      #   1+ → FAILED  — pipeline fails here, merge is BLOCKED automatically
      - name: "Run ML Guard Governance Gate"
        id: gate
        run: |
          python ml_guard/sdk/python/mlguard_cli.py check \
            --policy mlguard.yaml \
            --artifact models/latest_model.pkl

      # ── Step 7: Save governance report as a CI artifact ────────────────────
      # Uploads the generated governance report so engineers can download it
      # directly from the GitHub Actions run summary.
      # Runs even if the gate FAILED to preserve the evidence.
      - name: "Upload governance report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report-${{ github.sha }}
          path: |
            governance_report.json
            governance_report.html
            governance_report.pdf
          if-no-files-found: warn
          retention-days: 30

      # ── Step 8: Post governance badge to PR (optional) ─────────────────────
      # Posts the live governance score badge as a comment on the PR.
      # Uses the /api/v1/gate/evaluate SVG badge URL from the ML Guard API.
      - name: "Post governance badge to PR"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the badge URL from the ML Guard API
          BADGE_URL="${{ vars.MLGUARD_API_URL || 'http://127.0.0.1:8000' }}/api/v1/gate/evaluate/badge?sha=${{ github.sha }}"

          # Post as a PR comment using the GitHub CLI
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "### ML Guard Governance Report
          | Field | Value |
          |---|---|
          | Commit | \`${{ github.sha }}\` |
          | Policy | \`mlguard.yaml\` |
          | Artifact | \`models/latest_model.pkl\` |
          | Run | [View Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ![ML Guard Badge]($BADGE_URL)" \
            --edit-last 2>/dev/null || \
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "### ML Guard Governance Report
          | Field | Value |
          |---|---|
          | Commit | \`${{ github.sha }}\` |
          | Policy | \`mlguard.yaml\` |
          | Artifact | \`models/latest_model.pkl\` |
          | Run | [View Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"

  # ---------------------------------------------------------------------------
  # JOB 2: Backend Tests
  # Runs the FastAPI backend test suite in parallel with the governance gate.
  # Validates that the ingestion pipeline, contract engine, and API routes
  # are all functioning correctly.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: "Backend Tests (FastAPI)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Cache pip dependencies"
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-backend-${{ hashFiles('ml_guard/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-backend-

      - name: "Install backend dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_guard/backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: "Run backend tests"
        working-directory: ml_guard/backend
        run: |
          pytest -v --tb=short --no-header \
            -p no:warnings \
            2>&1 | tee ../../test-results-backend.txt

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.sha }}
          path: test-results-backend.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 3: Frontend Lint
  # Validates the Next.js frontend TypeScript code with ESLint.
  # Ensures UI changes don't introduce type errors or lint violations.
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: "Frontend Lint (Next.js)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ml_guard/frontend/package-lock.json

      - name: "Install frontend dependencies"
        working-directory: ml_guard/frontend
        run: npm ci --prefer-offline

      - name: "Run ESLint"
        working-directory: ml_guard/frontend
        run: npm run lint

      - name: "Run TypeScript type check"
        working-directory: ml_guard/frontend
        run: npx tsc --noEmit 2>&1 | tee ../../typecheck-results.txt || true

      - name: "Upload typecheck results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-${{ github.sha }}
          path: typecheck-results.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 4: Gate Summary (requires all other jobs)
  # Acts as the final merge gate. Only passes if the governance gate,
  # backend tests, and frontend lint all succeed.
  # ---------------------------------------------------------------------------
  gate-summary:
    name: "All Gates Passed"
    runs-on: ubuntu-latest
    needs:
      - governance-gate
      - backend-tests
      - frontend-lint
    if: always()

    steps:
      - name: "Check all jobs passed"
        run: |
          if [[ "${{ needs.governance-gate.result }}" != "success" ]]; then
            echo "FAILED: Governance gate did not pass."
            exit 1
          fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "FAILED: Backend tests did not pass."
            exit 1
          fi
          if [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
            echo "FAILED: Frontend lint did not pass."
            exit 1
          fi
          echo "SUCCESS: All ML Guard governance gates passed. Ready to merge."
